<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERGEN // System Settings</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="set.css">
</head>
<body id="app-body">
    <div class="glow-bg"></div>

    <nav class="navbar">
        <div class="logo">CYBER<span>GEN</span></div>
        <div class="nav-right">
            <a href="gen.html" class="nav-btn-icon">⬅️ BACK TO STUDIO</a>
            <button class="logout-btn" onclick="logout()">EXIT</button>
        </div>
    </nav>

    <main class="settings-container">
        <div class="settings-header">
            <h2>SYSTEM CONFIGURATION</h2>
            <p>Manage your identity, visual rendering quality, theme preferences, and neural history logs.</p>
        </div>

        <div class="settings-grid">
            <!-- Account & Security -->
            <section class="settings-card">
                <h3>👤 USER IDENTITY & SECURITY</h3>
                <form id="profile-form" onsubmit="saveProfile(event)">
                    <div class="input-group">
                        <label>CODENAME / USERNAME</label>
                        <input type="text" id="set-username" required>
                    </div>
                    <div class="input-group">
                        <label>NET ID / EMAIL</label>
                        <input type="email" id="set-email" required>
                    </div>
                    <div class="input-group">
                        <label>NEW PASSCODE</label>
                        <input type="password" id="set-pass" placeholder="••••••••">
                    </div>
                    <button type="submit" class="cyber-btn">UPDATE CREDENTIALS</button>
                </form>
            </section>

            <!-- Preferences -->
            <section class="settings-card">
                <h3>🎨 RENDER & THEME ENGINE</h3>
                <div class="setting-item">
                    <label>IMAGE RENDER QUALITY</label>
                    <select id="set-quality" onchange="savePreferences()">
                        <option value="standard">Standard (Fast Render)</option>
                        <option value="high">Ultra High-Res (AI Enhanced)</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label>SYSTEM THEME</label>
                    <div class="theme-options">
                        <button class="theme-btn active" data-theme="cyberpunk" onclick="setTheme('cyberpunk', this)">Cyberpunk Neon</button>
                        <button class="theme-btn" data-theme="dark" onclick="setTheme('dark', this)">Midnight Dark</button>
                    </div>
                </div>
            </section>

            <!-- History Logs -->
            <section class="settings-card full-width">
                <div class="card-header-flex">
                    <h3>📜 NEURAL LOGS (GENERATION HISTORY)</h3>
                    <button class="danger-btn" onclick="clearHistory()">CLEAR ALL LOGS</button>
                </div>
                <div id="settings-history-grid" class="settings-history-grid">
                    <!-- Dynamic History Items -->
                </div>
            </section>
        </div>
    </main>

    <script src="set.js"></script>
</body>
</html>
