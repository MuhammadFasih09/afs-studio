<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERGEN // Interactive System Settings</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="set.css">
</head>
<body id="app-body">
    <div class="glow-bg"></div>

    <nav class="navbar">
        <div class="logo">CYBER<span>GEN</span></div>
        <div class="nav-right">
            <a href="gen.html" class="nav-btn-icon">⬅️ BACK TO STUDIO</a>
            <button class="logout-btn" onclick="logout()">EXIT</button>
        </div>
    </nav>

    <main class="settings-container">
        <div class="settings-header">
            <h2>SYSTEM CONFIGURATION</h2>
            <p>Click on any setting module below to open and customize your preferences.</p>
        </div>

        <div class="accordion-group">

            <!-- 1. USER PROFILE & CREDENTIALS -->
            <div class="setting-accordion">
                <button class="accordion-btn" onclick="toggleAccordion('profile-panel')">
                    <span>👤 USER ACCOUNT CREDENTIALS</span>
                    <span class="chevron">▼</span>
                </button>
                <div id="profile-panel" class="accordion-panel hidden">
                    <form id="profile-form" onsubmit="saveProfile(event)">
                        <div class="input-group">
                            <label>CODENAME / USERNAME</label>
                            <input type="text" id="set-username" required>
                        </div>
                        <div class="input-group">
                            <label>NET ID / EMAIL</label>
                            <input type="email" id="set-email" required>
                        </div>
                        <div class="input-group">
                            <label>SECURITY PASSCODE</label>
                            <input type="password" id="set-pass" placeholder="••••••••">
                        </div>
                        <button type="submit" class="cyber-btn">SAVE ACCOUNT CHANGES</button>
                    </form>
                </div>
            </div>

            <!-- 2. THEME SELECTION -->
            <div class="setting-accordion">
                <button class="accordion-btn" onclick="toggleAccordion('theme-panel')">
                    <span>🎨 SYSTEM THEME SELECTOR</span>
                    <span class="chevron">▼</span>
                </button>
                <div id="theme-panel" class="accordion-panel hidden">
                    <p class="panel-desc">Select visual environment mode:</p>
                    <div class="theme-options">
                        <button class="theme-btn active" data-theme="cyberpunk" onclick="setTheme('cyberpunk', this)">🔮 CYBERPUNK NEON</button>
                        <button class="theme-btn" data-theme="dark" onclick="setTheme('dark', this)">🌙 MIDNIGHT DARK</button>
                    </div>
                </div>
            </div>

            <!-- 3. RENDER QUALITY SELECTION -->
            <div class="setting-accordion">
                <button class="accordion-btn" onclick="toggleAccordion('quality-panel')">
                    <span>⚡ NEURAL RENDER QUALITY</span>
                    <span class="chevron">▼</span>
                </button>
                <div id="quality-panel" class="accordion-panel hidden">
                    <p class="panel-desc">Choose image generation resolution engine:</p>
                    <div class="quality-options">
                        <button class="quality-btn active" data-quality="standard" onclick="setQuality('standard', this)">
                            <strong>STANDARD QUALITY</strong>
                            <span>Fast generation • 1024x1024 base resolution</span>
                        </button>
                        <button class="quality-btn" data-quality="high" onclick="setQuality('high', this)">
                            <strong>ULTRA HIGH-RES (AI ENHANCED)</strong>
                            <span>Deep detail • AI Upscaled rendering</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 4. GENERATION HISTORY LOGS -->
            <div class="setting-accordion">
                <button class="accordion-btn" onclick="toggleAccordion('history-panel')">
                    <span>📜 GENERATION HISTORY LOGS</span>
                    <span class="chevron">▼</span>
                </button>
                <div id="history-panel" class="accordion-panel hidden">
                    <div class="card-header-flex">
                        <p class="panel-desc">Your recent neural generation outputs:</p>
                        <button class="danger-btn" onclick="clearHistory()">CLEAR ALL LOGS</button>
                    </div>
                    <div id="settings-history-grid" class="settings-history-grid">
                        <!-- Dynamic Renders Load Here -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="set.js"></script>
</body>
</html>
