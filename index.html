<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign-up Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow-bg"></div>
    
    <nav class="navbar">
        <div class="logo">CYBER<span>GEN</span></div>
        <div class="status-badge"><span class="pulse"></span> SYSTEM ONLINE</div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">
            <div class="tab-header">
                <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">LOGIN</button>
                <button id="tab-signup" class="tab-btn" onclick="switchTab('signup')">SIGN UP</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active" onsubmit="handleAuth(event, 'login')">
                <div class="input-group">
                    <label>ACCESS ID / EMAIL</label>
                    <input type="email" id="login-email" placeholder="runner@cyberpunk.net" required>
                </div>
                <div class="input-group">
                    <label>SECURITY PASSCODE</label>
                    <input type="password" id="login-pass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="cyber-btn">INITIALIZE SESSION</button>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="auth-form" onsubmit="handleAuth(event, 'signup')">
                <div class="input-group">
                    <label>CODENAME / USERNAME</label>
                    <input type="text" id="signup-name" placeholder="Neo_Vip" required>
                </div>
                <div class="input-group">
                    <label>NET ID / EMAIL</label>
                    <input type="email" id="signup-email" placeholder="runner@cyberpunk.net" required>
                </div>
                <div class="input-group">
                    <label>CREATE PASSCODE</label>
                    <input type="password" id="signup-pass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="cyber-btn pink">CREATE IDENTITY</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
