<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFS IMG GEN // Login / Sign-up Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="app-body">
    <div class="glow-bg"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- BRANDING HEADER -->
            <div class="auth-header">
                <h1 class="logo">AFS <span>IMG GEN</span></h1>
            </div>

            <!-- TAB CONTROLS -->
            <div class="auth-tabs">
                <button id="login-tab" class="tab-btn active" onclick="switchTab('login')">LOGIN</button>
                <button id="signup-tab" class="tab-btn" onclick="switchTab('signup')">SIGN UP</button>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="login-email">EMAIL</label>
                    <input type="email" id="login-email" placeholder="enter your email..." required>
                </div>
                <div class="input-group">
                    <label for="login-password">PASSWORD</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="cyber-btn">LOGIN</button>
            </form>

            <!-- SIGN UP FORM -->
            <form id="signup-form" class="auth-form hidden" onsubmit="handleSignup(event)">
                <div class="input-group">
                    <label for="signup-username">USERNAME</label>
                    <input type="text" id="signup-username" placeholder="choose username..." required>
                </div>
                <div class="input-group">
                    <label for="signup-email">EMAIL</label>
                    <input type="email" id="signup-email" placeholder="enter email address..." required>
                </div>
                <div class="input-group">
                    <label for="signup-password">CREATE PASSWORD</label>
                    <input type="password" id="signup-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="cyber-btn">CREATE ACCOUNT</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
